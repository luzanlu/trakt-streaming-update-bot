name: Trakt Streaming Update Bot

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trakt-streaming-update-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Trakt bot
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          TRAKT_ACCESS_TOKEN: ${{ secrets.TRAKT_ACCESS_TOKEN }}
          TRAKT_REFRESH_TOKEN: ${{ secrets.TRAKT_REFRESH_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_SECRET_WRITE_TOKEN: ${{ secrets.GH_SECRET_WRITE_TOKEN }}
          BOT_CONFIG_FILE: ${{ vars.BOT_CONFIG_FILE }}
          TRAKT_ENABLED: ${{ vars.TRAKT_ENABLED }}
          TRAKT_SHOWS_ENABLED: ${{ vars.TRAKT_SHOWS_ENABLED }}
          TRAKT_MOVIES_ENABLED: ${{ vars.TRAKT_MOVIES_ENABLED }}
          JUSTWATCH_ENABLED: ${{ vars.JUSTWATCH_ENABLED }}
          JUSTWATCH_COUNTRY: ${{ vars.JUSTWATCH_COUNTRY }}
          JUSTWATCH_LANGUAGE: ${{ vars.JUSTWATCH_LANGUAGE }}
          JUSTWATCH_MEDIA_TYPES: ${{ vars.JUSTWATCH_MEDIA_TYPES }}
          JUSTWATCH_PROVIDERS: ${{ vars.JUSTWATCH_PROVIDERS }}
          JUSTWATCH_URLS: ${{ vars.JUSTWATCH_URLS }}
          JUSTWATCH_BOOTSTRAP_ONLY: ${{ vars.JUSTWATCH_BOOTSTRAP_ONLY }}
          JUSTWATCH_ITEMS_PER_PROVIDER: ${{ vars.JUSTWATCH_ITEMS_PER_PROVIDER }}
          JUSTWATCH_MAX_ITEMS: ${{ vars.JUSTWATCH_MAX_ITEMS }}
          JUSTWATCH_MAX_AGE_DAYS: ${{ vars.JUSTWATCH_MAX_AGE_DAYS }}
          FFZY_ENABLED: ${{ vars.FFZY_ENABLED }}
          FFZY_DOMAINS: ${{ vars.FFZY_DOMAINS }}
          FFZY_CATEGORIES: ${{ vars.FFZY_CATEGORIES }}
          FFZY_BOOTSTRAP_ONLY: ${{ vars.FFZY_BOOTSTRAP_ONLY }}
          FFZY_TYPE_IDS: ${{ vars.FFZY_TYPE_IDS }}
          FFZY_ITEMS_PER_TYPE: ${{ vars.FFZY_ITEMS_PER_TYPE }}
          FFZY_PAGES_PER_TYPE: ${{ vars.FFZY_PAGES_PER_TYPE }}
          FFZY_MAX_ITEMS: ${{ vars.FFZY_MAX_ITEMS }}
          FFZY_MAX_AGE_HOURS: ${{ vars.FFZY_MAX_AGE_HOURS }}
          FFZY_REQUEST_TIMEOUT: ${{ vars.FFZY_REQUEST_TIMEOUT }}
          BFZY_ENABLED: ${{ vars.BFZY_ENABLED }}
          BFZY_DOMAINS: ${{ vars.BFZY_DOMAINS }}
          BFZY_CATEGORIES: ${{ vars.BFZY_CATEGORIES }}
          BFZY_BOOTSTRAP_ONLY: ${{ vars.BFZY_BOOTSTRAP_ONLY }}
          BFZY_TYPE_IDS: ${{ vars.BFZY_TYPE_IDS }}
          BFZY_ITEMS_PER_TYPE: ${{ vars.BFZY_ITEMS_PER_TYPE }}
          BFZY_PAGES_PER_TYPE: ${{ vars.BFZY_PAGES_PER_TYPE }}
          BFZY_MAX_ITEMS: ${{ vars.BFZY_MAX_ITEMS }}
          BFZY_MAX_AGE_HOURS: ${{ vars.BFZY_MAX_AGE_HOURS }}
          BFZY_REQUEST_TIMEOUT: ${{ vars.BFZY_REQUEST_TIMEOUT }}
        run: python trakt_bot.py

      - name: Commit pushed episode state
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain pushed_episodes.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add pushed_episodes.json
            git commit -m "chore: update pushed episodes"
            git push
          else
            echo "No pushed_episodes.json changes to commit."
          fi
