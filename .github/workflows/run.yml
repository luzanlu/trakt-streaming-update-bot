name: Trakt Streaming Update Bot

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trakt-streaming-update-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Trakt bot
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          TRAKT_ACCESS_TOKEN: ${{ secrets.TRAKT_ACCESS_TOKEN }}
          TRAKT_REFRESH_TOKEN: ${{ secrets.TRAKT_REFRESH_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_SECRET_WRITE_TOKEN: ${{ secrets.GH_SECRET_WRITE_TOKEN }}
          JUSTWATCH_ENABLED: ${{ vars.JUSTWATCH_ENABLED || 'true' }}
          JUSTWATCH_PROVIDERS: ${{ vars.JUSTWATCH_PROVIDERS }}
          JUSTWATCH_URLS: ${{ vars.JUSTWATCH_URLS }}
          JUSTWATCH_BOOTSTRAP_ONLY: ${{ vars.JUSTWATCH_BOOTSTRAP_ONLY || 'true' }}
          JUSTWATCH_ITEMS_PER_PROVIDER: ${{ vars.JUSTWATCH_ITEMS_PER_PROVIDER || '10' }}
          JUSTWATCH_MAX_ITEMS: ${{ vars.JUSTWATCH_MAX_ITEMS || '100' }}
          JUSTWATCH_MAX_AGE_DAYS: ${{ vars.JUSTWATCH_MAX_AGE_DAYS || '14' }}
          FFZY_ENABLED: ${{ vars.FFZY_ENABLED || 'true' }}
          FFZY_DOMAINS: ${{ vars.FFZY_DOMAINS || 'ffzy1.tv,ffzy2.tv,ffzy3.tv,ffzy4.tv,ffzy5.tv' }}
          FFZY_BOOTSTRAP_ONLY: ${{ vars.FFZY_BOOTSTRAP_ONLY || 'true' }}
          FFZY_TYPE_IDS: ${{ vars.FFZY_TYPE_IDS || '13,14,15,16,29,30,31' }}
          FFZY_ITEMS_PER_TYPE: ${{ vars.FFZY_ITEMS_PER_TYPE || '20' }}
          FFZY_PAGES_PER_TYPE: ${{ vars.FFZY_PAGES_PER_TYPE || '1' }}
          FFZY_MAX_ITEMS: ${{ vars.FFZY_MAX_ITEMS || '200' }}
          FFZY_MAX_AGE_HOURS: ${{ vars.FFZY_MAX_AGE_HOURS || '168' }}
          FFZY_REQUEST_TIMEOUT: ${{ vars.FFZY_REQUEST_TIMEOUT || '8' }}
        run: python trakt_bot.py

      - name: Commit pushed episode state
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain pushed_episodes.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add pushed_episodes.json
            git commit -m "chore: update pushed episodes"
            git push
          else
            echo "No pushed_episodes.json changes to commit."
          fi
