name: Trakt Streaming Update Bot

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trakt-streaming-update-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate bot configuration
        env:
          BOT_CONFIG_FILE: ${{ vars.BOT_CONFIG_FILE || 'bot_config.json' }}
        run: python -m json.tool "${BOT_CONFIG_FILE:-bot_config.json}" > /dev/null

      - name: Run Trakt bot
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          TRAKT_ACCESS_TOKEN: ${{ secrets.TRAKT_ACCESS_TOKEN }}
          TRAKT_REFRESH_TOKEN: ${{ secrets.TRAKT_REFRESH_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_SECRET_WRITE_TOKEN: ${{ secrets.GH_SECRET_WRITE_TOKEN }}
          BOT_CONFIG_FILE: ${{ vars.BOT_CONFIG_FILE || 'bot_config.json' }}
          TRAKT_ENABLED: ${{ vars.TRAKT_ENABLED || 'true' }}
          TRAKT_SHOWS_ENABLED: ${{ vars.TRAKT_SHOWS_ENABLED || 'true' }}
          TRAKT_MOVIES_ENABLED: ${{ vars.TRAKT_MOVIES_ENABLED || 'true' }}
          JUSTWATCH_ENABLED: ${{ vars.JUSTWATCH_ENABLED || 'true' }}
          JUSTWATCH_COUNTRY: ${{ vars.JUSTWATCH_COUNTRY || 'TW' }}
          JUSTWATCH_LANGUAGE: ${{ vars.JUSTWATCH_LANGUAGE || 'zh' }}
          JUSTWATCH_MEDIA_TYPES: ${{ vars.JUSTWATCH_MEDIA_TYPES || 'show,movie' }}
          JUSTWATCH_PROVIDERS: ${{ vars.JUSTWATCH_PROVIDERS }}
          JUSTWATCH_URLS: ${{ vars.JUSTWATCH_URLS }}
          JUSTWATCH_BOOTSTRAP_ONLY: ${{ vars.JUSTWATCH_BOOTSTRAP_ONLY || 'true' }}
          JUSTWATCH_ITEMS_PER_PROVIDER: ${{ vars.JUSTWATCH_ITEMS_PER_PROVIDER || '10' }}
          JUSTWATCH_MAX_ITEMS: ${{ vars.JUSTWATCH_MAX_ITEMS || '100' }}
          JUSTWATCH_MAX_AGE_DAYS: ${{ vars.JUSTWATCH_MAX_AGE_DAYS || '14' }}
          FFZY_ENABLED: ${{ vars.FFZY_ENABLED || 'true' }}
          FFZY_DOMAINS: ${{ vars.FFZY_DOMAINS || 'ffzy1.tv,ffzy2.tv,ffzy3.tv,ffzy4.tv,ffzy5.tv' }}
          FFZY_CATEGORIES: ${{ vars.FFZY_CATEGORIES }}
          FFZY_BOOTSTRAP_ONLY: ${{ vars.FFZY_BOOTSTRAP_ONLY || 'true' }}
          FFZY_TYPE_IDS: ${{ vars.FFZY_TYPE_IDS }}
          FFZY_ITEMS_PER_TYPE: ${{ vars.FFZY_ITEMS_PER_TYPE || '20' }}
          FFZY_PAGES_PER_TYPE: ${{ vars.FFZY_PAGES_PER_TYPE || '1' }}
          FFZY_MAX_ITEMS: ${{ vars.FFZY_MAX_ITEMS || '200' }}
          FFZY_MAX_AGE_HOURS: ${{ vars.FFZY_MAX_AGE_HOURS || '168' }}
          FFZY_REQUEST_TIMEOUT: ${{ vars.FFZY_REQUEST_TIMEOUT || '8' }}
          BFZY_ENABLED: ${{ vars.BFZY_ENABLED || 'true' }}
          BFZY_DOMAINS: ${{ vars.BFZY_DOMAINS || 'bfzyapi.com,bfzy.tv' }}
          BFZY_CATEGORIES: ${{ vars.BFZY_CATEGORIES }}
          BFZY_BOOTSTRAP_ONLY: ${{ vars.BFZY_BOOTSTRAP_ONLY || 'true' }}
          BFZY_TYPE_IDS: ${{ vars.BFZY_TYPE_IDS }}
          BFZY_ITEMS_PER_TYPE: ${{ vars.BFZY_ITEMS_PER_TYPE || '20' }}
          BFZY_PAGES_PER_TYPE: ${{ vars.BFZY_PAGES_PER_TYPE || '1' }}
          BFZY_MAX_ITEMS: ${{ vars.BFZY_MAX_ITEMS || '200' }}
          BFZY_MAX_AGE_HOURS: ${{ vars.BFZY_MAX_AGE_HOURS || '168' }}
          BFZY_REQUEST_TIMEOUT: ${{ vars.BFZY_REQUEST_TIMEOUT || '8' }}
          # MyDramaList 已拆到 .github/workflows/mydramalist.yml 每 5 分钟单独跑，
          # 这里关掉，避免同一个源被两处重复推送。
          MYDRAMALIST_ENABLED: ${{ vars.MYDRAMALIST_ENABLED || 'false' }}
          MYDRAMALIST_COUNTRIES: ${{ vars.MYDRAMALIST_COUNTRIES }}
          MYDRAMALIST_TYPES: ${{ vars.MYDRAMALIST_TYPES }}
          MYDRAMALIST_TIMEZONE: ${{ vars.MYDRAMALIST_TIMEZONE || 'Asia/Shanghai' }}
          MYDRAMALIST_ONLY_AIRED: ${{ vars.MYDRAMALIST_ONLY_AIRED || 'true' }}
          MYDRAMALIST_LOOKAHEAD_HOURS: ${{ vars.MYDRAMALIST_LOOKAHEAD_HOURS || '0' }}
          MYDRAMALIST_BOOTSTRAP_ONLY: ${{ vars.MYDRAMALIST_BOOTSTRAP_ONLY || 'true' }}
          MYDRAMALIST_MAX_ITEMS: ${{ vars.MYDRAMALIST_MAX_ITEMS || '200' }}
          MYDRAMALIST_REQUEST_TIMEOUT: ${{ vars.MYDRAMALIST_REQUEST_TIMEOUT || '20' }}
          MYDRAMALIST_COOKIE: ${{ secrets.MYDRAMALIST_COOKIE }}
        run: python trakt_bot.py

      - name: Commit pushed episode state
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain pushed_episodes.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add pushed_episodes.json
            git commit -m "chore: update pushed episodes"
            git push
          else
            echo "No pushed_episodes.json changes to commit."
          fi
