name: MDL photo test

on:
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install -r requirements.txt
      - name: Send one photo card
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          MYDRAMALIST_ENABLED: "true"
          MYDRAMALIST_ONLY_AIRED: "true"
          TARGET_TITLE: "Love in Disguise"
        run: |
          python - <<'PY'
          import logging
          import os
          import trakt_bot as t

          logging.basicConfig(level=logging.INFO, format="%(levelname)s %(message)s")
          items = t.fetch_mydramalist_items()
          print("FETCHED:", len(items))
          for it in items:
              print("ITEM:", it["title"], it["code"], it["aired"])
          target = os.getenv("TARGET_TITLE", "").strip().lower()
          chosen = next((x for x in items if x["title"].strip().lower() == target), None)
          if chosen is None:
              chosen = items[0] if items else None
          if chosen is None:
              print("NO_ITEMS")
              raise SystemExit(1)
          print("CHOSEN:", chosen["title"], chosen["code"], chosen["aired"], chosen.get("image"))
          print("SENT:", t.send_telegram_photo(chosen))
          PY
