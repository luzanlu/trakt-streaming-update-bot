name: MDL probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install
        run: pip install requests curl_cffi
      - name: Probe
        run: |
          python - <<'PY'
          import requests
          from curl_cffi import requests as creq

          url = ("https://mydramalist.com/episode-calendar?view=large&scope=all"
                 "&tz=Asia%2FShanghai&country%5B%5D=South+Korea&type%5B%5D=Drama")
          H = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                            "(KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "Accept-Language": "en-US,en;q=0.9",
          }

          r = requests.get(url, headers=H, timeout=30)
          print("REQ requests      :", r.status_code, len(r.text), r.text.count("episode-card-large"))

          for imp in ("chrome", "chrome124", "safari17_0"):
              try:
                  r2 = creq.get(url, impersonate=imp, timeout=40)
                  print(f"REQ curl_cffi {imp:10s}:", r2.status_code, len(r2.text), r2.text.count("episode-card-large"))
              except Exception as exc:
                  print(f"REQ curl_cffi {imp:10s}: ERROR {type(exc).__name__} {exc}")
          PY
